# =========================================================
# Kitty Terminal Config (macOS)
# =========================================================

# === Fonts & Appearance ===
font_family      FiraCode Nerd Font Mono, Menlo, monospace
bold_font        FiraCode Nerd Font Mono Bold
italic_font      FiraCode Nerd Font Mono Light
font_size        14.0

# Rendering & Spacing
disable_ligatures never
adjust_line_height  120%
adjust_column_width 100%

# Cursor
cursor_shape block
cursor_blink_interval 0

# === Colors ===
foreground   #d0d0d0
background   #1e1e1e
selection_foreground #000000
selection_background #c0c0c0
color0  #1e1e1e
color1  #d54e53
color2  #b9ca4a
color3  #e6c547
color4  #7aa6da
color5  #c397d8
color6  #70c0ba
color7  #eaeaea
color8  #666666
color9  #ff3334
color10 #9ec400
color11 #e7c547
color12 #7aa6da
color13 #b77ee0
color14 #54ced6
color15 #ffffff

# === macOS specific ===
# macos_titlebar_color background
macos_option_as_alt both   # allow Option as Alt (needed for mapping)
hide_window_decorations no

# === Key mappings ===
# Direct tilde (~) on Option+n
map alt+n ~

# Copy & Paste
map cmd+c copy_to_clipboard
map cmd+v paste_from_clipboard

# Tabs
map cmd+t new_tab
map cmd+w close_tab
map cmd+shift+] next_tab
map cmd+shift+[ previous_tab

# Fullscreen
map cmd+enter toggle_fullscreen

# === Clipboard & Selection ===
strip_trailing_spaces_in_selection yes

# === Tab Bar ===
tab_bar_edge bottom
tab_bar_style powerline
tab_bar_min_tabs 2

# === Scrollback ===
scrollback_lines 20000

# === Performance tweaks ===
repaint_delay 10
enable_audio_bell no
window_padding_width 6

confirm_os_window_close 0

# BEGIN_KITTY_THEME
# Night Owl
include current-theme.conf
# END_KITTY_THEME
