# =========================================================
# Ghostty Terminal Config (macOS) – FINAL & FUNKTIONIEREND
# =========================================================

# === Fonts & Appearance ===
font-family = "JetBrainsMono Nerd Font Mono", Menlo, monospace
font-size = 14

# Ligaturen aktivieren
font-feature = +liga

# Cursor
cursor-style = block
cursor-style-blink = false

# === Colors ===
foreground = #d0d0d0
background = #1e1e1e
selection-foreground = #000000
selection-background = #c0c0c0

# 16-Farben-Palette (korrekte Syntax: palette = <index>=<hex>)
palette = 0=#1e1e1e
palette = 1=#d54e53
palette = 2=#b9ca4a
palette = 3=#e6c547
palette = 4=#7aa6da
palette = 5=#c397d8
palette = 6=#70c0ba
palette = 7=#eaeaea
palette = 8=#666666
palette = 9=#ff3334
palette = 10=#9ec400
palette = 11=#e7c547
palette = 12=#7aa6da
palette = 13=#b77ee0
palette = 14=#54ced6
palette = 15=#ffffff

# === macOS ===
macos-titlebar-style = native
window-decoration = true

# === Keybindings ===
#keybind = alt+n=send_text:~
#keybind = cmd+c=copy
#keybind = cmd+v=paste
keybind = cmd+t=new_tab
keybind = cmd+w=close_tab
keybind = cmd+shift+]=next_tab
keybind = cmd+shift+[=previous_tab
keybind = cmd+enter=toggle_fullscreen
keybind = f5=reload_config

