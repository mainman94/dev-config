set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

unbind %
bind | split-window -h 

unbind '"'
bind - split-window -v

unbind r
bind r source-file ~/.tmux.conf

bind j resize-pane -D 5
bind k resize-pane -U 5
bind l resize-pane -R 5
bind h resize-pane -L 5

bind -r m resize-pane -Z

bind M-c attach-session -c "#{pane_current_path}"

set -g mouse on

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode when dragging with mouse

# remove delay for exiting insert mode with ESC in Neovim
set -sg escape-time 10

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# list of tmux plugins
set -g @plugin 'tmux-plugins/tpm'                # Tmux Plugin Manager
set -g @plugin 'tmux-plugins/tmux-resurrect'    # Persist sessions
set -g @plugin 'tmux-plugins/tmux-continuum'    # Auto save every 15 minutes
set -g @plugin 'tmux-plugins/tmux-sessionist'


set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# ----------------------------
# TMUX STATUS BAR CONFIG (BLUE THEME)
# ----------------------------

# Enable status bar
set -g status on
set -g status-interval 5          # Update every 5 seconds
set -g status-justify centre      # Center the window list (optional)

# Colors (Blue theme)
set -g status-bg colour235        # Background color: dark blue-gray
set -g status-fg colour45         # Foreground color: bright blue

# Left side: session name
set -g status-left " 💻 #S "       # #S = current session name

# Right side: date and time
set -g status-right " %Y-%m-%d %H:%M "  # Year-Month-Day Hour:Minute

# Optional: length limits for left and right status
set -g status-left-length 20
set -g status-right-length 20

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'