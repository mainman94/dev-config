# === Terminal and Color Support ===
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# === Prefix Key ===
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# === Split Panes ===
unbind %
bind | split-window -h
unbind '"'
bind - split-window -v

# === Reload Config ===
unbind r
bind r source-file ~/.tmux.conf

# === Pane Resizing ===
bind j resize-pane -D 5
bind k resize-pane -U 5
bind l resize-pane -R 5
bind h resize-pane -L 5

# === Toggle Pane Zoom ===
bind -r m resize-pane -Z

# === Attach Session in Current Path ===
bind M-c attach-session -c "#{pane_current_path}"

# === Mouse Support ===
# set -g mouse on
# unbind -T copy-mode-vi MouseDragEnd1Pane
# unbind -T copy-mode MouseDragEnd1Pane

# === Clipboard Integration (empfohlen für macOS) ===
# Für macOS: reattach-to-user-namespace installieren (falls noch nicht geschehen)
# brew install reattach-to-user-namespace

# === Vi Mode for Copy ===
# set-window-option -g mode-keys vi  # <-- auskommentiert für normale Copy-Logik

# === Copy Mode Key Bindings ===
# bind-key -T copy-mode-vi 'v' send -X begin-selection
# bind-key -T copy-mode-vi 'y' send -X copy-selection

# === Standard Copy/Paste Key Bindings ===
# bind [ copy-mode
# bind ] paste-buffer

# === Don't Exit Copy Mode on Mouse Drag ===
# unbind -T copy-mode-vi MouseDragEnd1Pane

# === Reduce ESC Delay for Neovim ===
set -sg escape-time 10

# === Plugins ===
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-sessionist'
set -g @plugin 'tmux-plugins/tmux-yank'   # <--- NEU

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# === Status Bar Config (Blue Theme) ===
set -g status on
set -g status-interval 5
set -g status-justify centre
set -g status-bg colour235
set -g status-fg colour45
set -g status-left " 💻 #S "
set -g status-right " %Y-%m-%d %H:%M "
set -g status-left-length 20
set -g status-right-length 20

# === Initialize Plugin Manager (Keep at Bottom) ===
run '~/.tmux/plugins/tpm/tpm'